# HTML names the hashed bundles, so it is never cached. Every other file served from the
# web root (public/: share images, favicon, robots.txt) is cached for an hour.
map $sent_http_content_type $site_cache_control {
  default "public, max-age=3600";
  ~^text/html "no-cache, no-store, must-revalidate";
}

# Market for the bare domain amiticia.cc/ (brief: only the entry without a market detects; GPS/IP never
# count). The first language in Accept-Language that is Italian or Portuguese wins, in the browser's own
# order: the lazy (?:[^,]*,)*? tries the earliest entry first, and a tag must start with it/pt
# (en-IT does not count). Portuguese goes to Brazil's own domain; anything else goes to /it, the main
# audience, until /en exists.
# Same language rule as deploy/preview/nginx.preview.conf (which has no redirect): change both together.
map $http_accept_language $site_first_lang {
  default "";
  "~*^(?:[^,]*,)*?\s*(?<first>it|pt)(?:[-_;,\s]|$)" $first;
}

map $site_first_lang $site_home {
  default /it;
  ~*^pt https://amiticia.com.br/;
  ~*^it /it;
}

# amiticia.com.br (and www): Brazil. Clean URLs (/, /wahub, /patricia) are answered from the prerendered
# files under /br/ by try_files: the /br prefix is internal and never visible. The Italian site and the
# knowledge area live on amiticia.cc only, so they are redirected there. This server has no /k proxy:
# nothing here injects the research token.
server {
  listen 3000;
  server_name amiticia.com.br www.amiticia.com.br;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Home. A location of its own: try_files "$uri" on "/" would match the web root directory itself.
  location = / {
    try_files /br/index.html =404;
    add_header Cache-Control $site_cache_control;
  }

  # Files from public/ and the bundles first, then a prerendered Brazilian page (/wahub, /wahub/),
  # else the SPA shell (its client router renders the 404).
  location / {
    try_files $uri /br$uri/index.html /index.html;
    add_header Cache-Control $site_cache_control;
  }

  # The old prefixed URLs keep working: /br → /, /br/wahub → /wahub (query string is carried over).
  location ~ ^/br(/|$) {
    rewrite ^/br/?(.*)$ https://amiticia.com.br/$1 permanent;
  }

  # The other market and the knowledge area belong to amiticia.cc, same path.
  location ~ ^/(it|k)(/|$) {
    return 301 https://amiticia.cc$request_uri;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }
}

# Everything else (amiticia.cc, the container's own address): Italy, the knowledge area and the bare-domain
# redirect. A Brazilian path typed here is sent to amiticia.com.br.
server {
  listen 3000 default_server;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Prerendered Italian pages live at <path>/index.html (/it, /it/wahub…), served
  # without a redirect so /it and /it/ both answer 200. Everything else falls back
  # to the SPA shell. Cache-Control follows the content type (see the map above).
  location / {
    try_files $uri $uri/index.html /index.html;
    add_header Cache-Control $site_cache_control;
  }

  # The bare domain opens a market, chosen by the browser language ($site_home above): Portuguese goes
  # to amiticia.com.br, the rest to /it. A relative Location needs absolute_redirect off, or nginx would
  # send the container's own :3000 port.
  location = / {
    absolute_redirect off;
    add_header Vary "Accept-Language" always;
    add_header Cache-Control "no-store" always;
    return 302 $site_home;
  }

  # Brazilian pages live on amiticia.com.br: /br… and the clean paths typed on this domain go there.
  location ~ ^/br(/|$) {
    rewrite ^/br/?(.*)$ https://amiticia.com.br/$1 permanent;
  }

  location ~ ^/(wahub|patricia)(/|$) {
    return 301 https://amiticia.com.br$request_uri;
  }

  # Knowledge repo topic pages — read-only bind-mount of /storage/knowledge.
  # Served as text so react-markdown can fetch and render them client-side.
  location /k/data/ {
    alias /knowledge/topics/;
    default_type text/markdown;
    add_header Cache-Control "no-cache";
  }

  # Knowledge research API — proxied to the knowledge-engine research container
  # (both containers share the network_public Docker network). The bearer
  # token is injected here, server-side, via a bind-mounted auth file — so it
  # never reaches the browser. /k is already gated by Traefik BasicAuth.
  #
  # Resolution is DEFERRED to request time: the upstream host is held in a
  # variable and resolved per-request via Docker's embedded DNS (127.0.0.11),
  # so nginx BOOTS CLEANLY even if that container is renamed, down, or absent —
  # the marketing site never hard-depends on it (only /k/api then 502s). This
  # replaces a bare `proxy_pass http://host/...`, which nginx resolves at boot
  # and which crash-looped the whole site when the research container was
  # renamed. Wildcard include: absent auth file still starts cleanly.
  location /k/api/ {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $research_upstream amiticia-knowledge-engine-research;
    rewrite ^/k/api/(.*)$ /api/$1 break;
    proxy_pass http://$research_upstream:39010;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    include /etc/nginx/research-auth*.conf;
    proxy_connect_timeout 10s;
    proxy_read_timeout 180s;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }
}
