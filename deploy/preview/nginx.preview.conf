# Preview stack nginx: the production nginx.conf, minus the knowledge area, plus noindex. One tunnel host
# serves both markets: Brazil on the clean paths (/, /wahub, /patricia), Italy under /it, with no
# cross-domain redirect and no language redirect. Keep it in step with ../../nginx.conf
# (scripts/e2e-preview-nginx.sh checks the preview behaviour).
# Every location that sets its own add_header repeats X-Robots-Tag: nginx does not inherit
# add_header into a location that defines one.
map $sent_http_content_type $site_cache_control {
  default "public, max-age=3600";
  ~^text/html "no-cache, no-store, must-revalidate";
}

server {
  listen 3000;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  add_header X-Robots-Tag "noindex, nofollow" always;

  # The image is built with the production origins. The quick tunnel's URL changes on every start,
  # so HTML answers carry the host they were requested on instead: canonical, og:url, og:image and the
  # language-switcher links follow the current tunnel URL without a rebuild. Only the two exact origins
  # match, not subdomains such as https://wahub.amiticia.cc.
  sub_filter_once off;
  sub_filter "https://amiticia.cc" "https://$host";
  sub_filter "https://amiticia.com.br" "https://$host";

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Italian pages first ($uri/index.html), then Brazil's prerendered files under /br/ (so /wahub works),
  # else the SPA shell.
  location / {
    try_files $uri $uri/index.html /br$uri/index.html /index.html;
    add_header Cache-Control $site_cache_control;
    add_header X-Robots-Tag "noindex, nofollow" always;
  }

  # The Brazilian home. A location of its own: try_files "$uri" on "/" would match the web root itself.
  location = / {
    try_files /br/index.html =404;
    add_header Cache-Control $site_cache_control;
    add_header X-Robots-Tag "noindex, nofollow" always;
  }

  # Old prefixed URLs go to the clean path on the same host. Relative Location, or nginx would send
  # the container's own :3000 port to the browser.
  location ~ ^/br(/|$) {
    absolute_redirect off;
    add_header X-Robots-Tag "noindex, nofollow" always;
    rewrite ^/br/?(.*)$ /$1 permanent;
  }

  # The knowledge area (/k, /k/data/, /k/api/) is not part of the preview: it has no BasicAuth here.
  location ~ ^/k(/|$) {
    add_header X-Robots-Tag "noindex, nofollow" always;
    return 404;
  }

  location = /robots.txt {
    default_type text/plain;
    add_header X-Robots-Tag "noindex, nofollow" always;
    return 200 "User-agent: *\nDisallow: /\n";
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Robots-Tag "noindex, nofollow" always;
  }

  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header X-Robots-Tag "noindex, nofollow" always;
  }
}
