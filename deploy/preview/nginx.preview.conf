# Preview stack nginx: the production nginx.conf, minus the knowledge area and the legacy /, plus noindex.
# Keep it in step with ../../nginx.conf (scripts/e2e-preview-nginx.sh checks the preview behaviour).
# Every location that sets its own add_header repeats X-Robots-Tag: nginx does not inherit
# add_header into a location that defines one.
map $sent_http_content_type $site_cache_control {
  default "public, max-age=3600";
  ~^text/html "no-cache, no-store, must-revalidate";
}

# Market for the bare domain (brief: only the entry without a market detects; GPS/IP never count).
# The first language in Accept-Language that is Italian or Portuguese wins, in the browser's own
# order: the lazy (?:[^,]*,)*? tries the earliest entry first, and a tag must start with it/pt
# (en-IT does not count). Anything else goes to /it, the main audience, until /en exists.
map $http_accept_language $site_first_lang {
  default "";
  "~*^(?:[^,]*,)*?\s*(?<first>it|pt)(?:[-_;,\s]|$)" $first;
}

map $site_first_lang $site_home {
  default /it;
  ~*^pt /br;
  ~*^it /it;
}

server {
  listen 3000;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  add_header X-Robots-Tag "noindex, nofollow" always;

  # The image is built with the production origin. The quick tunnel's URL changes on every start,
  # so HTML answers carry the host they were requested on instead: canonical, og:url and og:image
  # follow the current tunnel URL without a rebuild. Only https://amiticia.cc itself matches, not
  # subdomains such as https://wahub.amiticia.cc.
  sub_filter_once off;
  sub_filter "https://amiticia.cc" "https://$host";

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  location / {
    try_files $uri $uri/index.html /index.html;
    add_header Cache-Control $site_cache_control;
    add_header X-Robots-Tag "noindex, nofollow" always;
  }

  # The preview shows v2 only: the bare domain opens a market instead of the legacy landing,
  # chosen by the browser language ($site_home above). Relative Location, or nginx would send
  # the container's own :3000 port to the browser.
  location = / {
    absolute_redirect off;
    add_header Vary "Accept-Language" always;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    return 302 $site_home;
  }

  # The knowledge area (/k, /k/data/, /k/api/) is not part of the preview: it has no BasicAuth here.
  location ~ ^/k(/|$) {
    add_header X-Robots-Tag "noindex, nofollow" always;
    return 404;
  }

  location = /robots.txt {
    default_type text/plain;
    add_header X-Robots-Tag "noindex, nofollow" always;
    return 200 "User-agent: *\nDisallow: /\n";
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Robots-Tag "noindex, nofollow" always;
  }

  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header X-Robots-Tag "noindex, nofollow" always;
  }
}
